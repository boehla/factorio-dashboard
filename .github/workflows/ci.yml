name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (build + self-tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build FactorioDashboard.sln -c Release

      # Both diagnostic/test projects live outside the solution and would
      # otherwise rot unnoticed.
      - name: Build tools
        run: |
          dotnet build tests/Fdash.Tests -c Release
          dotnet build tests/Fdash.LiveCheck -c Release

      # Returns the number of failed checks as the exit code.
      - name: Self-tests
        run: dotnet run --project tests/Fdash.Tests -c Release --no-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

  mod:
    name: Mod (Lua checks + packaging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund
        working-directory: mod/tools

      # Syntax, unexpected globals, cross-module calls.
      - name: Lua checks
        run: node check-lua.js ../fdash-exporter
        working-directory: mod/tools

      # info.json and changelog.txt have to agree, otherwise the mod portal
      # rejects the upload.
      - name: Validate info.json and changelog
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./mod/fdash-exporter/info.json').version")
          echo "info.json version: $version"

          if ! grep -qx "Version: $version" mod/fdash-exporter/changelog.txt; then
            echo "::error::changelog.txt has no 'Version: $version' entry"
            exit 1
          fi

          # The Factorio changelog separator must be exactly 99 dashes.
          if ! grep -qx -- "-\{99\}" mod/fdash-exporter/changelog.txt; then
            echo "::error::changelog.txt separator line is not exactly 99 dashes"
            exit 1
          fi

          for f in control.lua info.json settings.json thumbnail.png changelog.txt LICENSE; do
            test -f "mod/fdash-exporter/$f" || { echo "::error::missing mod/fdash-exporter/$f"; exit 1; }
          done

          if grep -rq "SET-ME" mod/fdash-exporter/; then
            echo "::warning::mod still contains SET-ME placeholders — fill them before uploading to the portal"
          fi
