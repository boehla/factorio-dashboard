[mod-setting-name]
fdash-enabled=Enable exporter
fdash-entity-budget=Entity budget per tick
fdash-chunk-budget=Chunk budget per tick
fdash-write-interval=File write interval (ticks)
fdash-file-output=Write snapshot files
fdash-resource-scan=Scan ore patches
fdash-covered-refresh-minutes=Ore-under-drill refresh (minutes)

[mod-setting-description]
fdash-enabled=Master switch. When off, no scanning and no file output happens at all.
fdash-entity-budget=Maximum number of entities inspected per tick, shared across all collectors. Lower = less UPS impact, slower refresh. 400 is safe even on megabases; raise it if your dashboard values update too slowly.
fdash-chunk-budget=Maximum map chunks scanned per tick during the initial entity scan and the rolling ore scan. One dense ore chunk can hold a few thousand entities, so keep this low.
fdash-write-interval=How often the collected snapshot is written to script-output/fdash/. 300 ticks = 5 seconds.
fdash-file-output=Write snapshot.json to script-output/fdash/. Turn this off if you read the data over RCON instead. In multiplayer every peer writes the file, so clients may want it off.
fdash-resource-scan=Rolling scan of all ore patches for remaining amounts and depletion estimates. This is the most expensive collector; turning it off removes ore totals from the dashboard but keeps drill statistics.
fdash-covered-refresh-minutes=How often the amount of ore inside each drill's mining radius is recalculated. The result is cached per drill; a low value costs UPS on drill-heavy bases.
