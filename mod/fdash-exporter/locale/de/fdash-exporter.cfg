[mod-setting-name]
fdash-enabled=Exporter aktiv
fdash-entity-budget=Entity-Budget pro Tick
fdash-chunk-budget=Chunk-Budget pro Tick
fdash-write-interval=Schreibintervall (Ticks)
fdash-file-output=Snapshot-Dateien schreiben
fdash-resource-scan=Erzfelder scannen
fdash-covered-refresh-minutes=Erz unter Bohrern neu messen (Minuten)

[mod-setting-description]
fdash-enabled=Hauptschalter. Aus = kein Scan, keine Dateiausgabe.
fdash-entity-budget=Maximale Anzahl Entities, die pro Tick angefasst werden — geteilt ueber alle Collector. Kleiner = weniger UPS-Kosten, langsamere Aktualisierung. 400 ist auch auf Megabases unbedenklich.
fdash-chunk-budget=Maximale Anzahl Map-Chunks pro Tick beim Erstscan und beim rollierenden Erz-Scan. Ein dichter Erz-Chunk enthaelt schnell einige tausend Entities — niedrig lassen.
fdash-write-interval=Wie oft der Snapshot nach script-output/fdash/ geschrieben wird. 300 Ticks = 5 Sekunden.
fdash-file-output=Schreibt snapshot.json nach script-output/fdash/. Aus, wenn die Daten stattdessen ueber RCON geholt werden. Im Multiplayer schreibt jeder Peer die Datei — Clients koennen das abschalten.
fdash-resource-scan=Rollierender Scan aller Erzfelder fuer Restmengen und Erschoepfungs-Prognose. Der teuerste Collector; aus heisst: keine Erz-Restmengen, Bohrer-Statistik bleibt.
fdash-covered-refresh-minutes=Wie oft die Erzmenge im Foerderradius jedes Bohrers neu bestimmt wird. Das Ergebnis wird pro Bohrer gecacht; kleine Werte kosten UPS auf bohrerlastigen Karten.
